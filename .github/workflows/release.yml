name: Release skill zip

# Push a tag like v0.1.0 to publish paper-fit-skill.zip on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin.json version
        run: |
          v=$(jq -r .version .claude-plugin/plugin.json)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != plugin.json version v$v"; exit 1; }

      - name: Build skill zip
        run: cd skills && zip -r ../paper-fit-skill.zip paper-fit

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" paper-fit-skill.zip --title "Paper Fit ${GITHUB_REF_NAME}" --generate-notes
